name: Import test APK from private builder
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Successful source workflow run ID'
        required: true
        default: '39132031850'
permissions:
  contents: write
jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check transfer token is configured
        env:
          TRANSFER_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
        run: |
          if [ -z "$TRANSFER_TOKEN" ]; then
            echo "::error::Set repository secret SOURCE_REPO_READ_TOKEN with fine-grained access to g-launcher-mobile (Actions: Read)."
            exit 1
          fi
      - name: Download source APK securely
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          mkdir -p apk
          gh run download "$SOURCE_RUN" --repo UnknownCode-2026/g-launcher-mobile --name g-launcher-debug-apk --dir apk
          APK="$(find apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" G-Launcher-Test-1.0.1.apk
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view launcher-test-1.0.1 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload launcher-test-1.0.1 G-Launcher-Test-1.0.1.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create launcher-test-1.0.1 G-Launcher-Test-1.0.1.apk --repo "${{ github.repository }}" --title "G-Launcher Test 1.0.1" --notes "Debug APK for community testing; not a production-signed release." --prerelease
          fi
